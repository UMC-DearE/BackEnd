server:
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 250
      min-spare: 20
    accept-count: 100

# 첫 배포 스키마 임시 세팅
spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

decorator:
  datasource:
    p6spy:
      enable-logging: false

# oauth redirect-uri
oauth:
  kakao:
    redirect-uri: ${KAKAO_REDIRECT_URI}
  google:
    redirect-uri: ${GOOGLE_REDIRECT_URI}

# health check & monitoring
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}