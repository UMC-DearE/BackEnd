name: Create Branch from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Extract prefix and title
        id: parse
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          TITLE="$ISSUE_TITLE"
          ISSUE_NUMBER="$ISSUE_NUMBER"

          # [PREFIX] 추출 후 소문자 변환
          PREFIX=$(echo "$TITLE" | grep -oP '(?<=\[)[^\]]+(?=\])' | head -1 | tr '[:upper:]' '[:lower:]')

          if [ -z "$PREFIX" ]; then
            echo "No [PREFIX] found in issue title. Skipping branch creation."
            exit 0
          fi

          # [PREFIX] 제거한 나머지 제목
          CLEAN_TITLE=$(echo "$TITLE" | sed 's/\[[^]]*\]//g' | xargs)

          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT
          echo "clean_title=$CLEAN_TITLE" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

      - name: Translate title to branch slug via Groq
        id: slug
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLEAN_TITLE: ${{ steps.parse.outputs.clean_title }}
        run: |
          CLEAN_TITLE="$CLEAN_TITLE"

          PROMPT="Convert this GitHub issue title to a git branch name slug. Rules: translate Korean to English, lowercase only, hyphens instead of spaces, remove special characters, max 5 words, return the slug only with no explanation. Issue title: $CLEAN_TITLE"

          BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              "model": "llama-3.1-8b-instant",
              "messages": [{"role": "user", "content": $prompt}],
              "max_tokens": 20,
              "temperature": 0
            }')

          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          SLUG=$(echo "$RESPONSE" | jq -r '.choices[0].message.content' | tr -d '\n' | xargs | tr ' ' '-' | tr '[:upper:]' '[:lower:]')

          if [ -z "$SLUG" ] || [ "$SLUG" = "null" ]; then
            echo "Groq API returned empty or null slug. Response: $RESPONSE"
            echo "Aborting branch creation."
            exit 1
          fi

          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Create branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ steps.parse.outputs.prefix }}
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          PREFIX="$PREFIX"
          ISSUE_NUMBER="$ISSUE_NUMBER"
          SLUG="$SLUG"

          BRANCH_NAME="${PREFIX}/#${ISSUE_NUMBER}-${SLUG}"

          echo "Creating branch: $BRANCH_NAME"

          gh api repos/${{ github.repository }}/git/refs \
            -X POST \
            -f ref="refs/heads/${BRANCH_NAME}" \
            -f sha=$(gh api repos/${{ github.repository }}/git/ref/heads/develop -q '.object.sha')

          echo "Branch '$BRANCH_NAME' created from develop."
