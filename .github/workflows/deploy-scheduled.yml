name: Scheduled Deploy - Merge at 4 AM KST

on:
  schedule:
    - cron: '0 19 * * *'  # 4 AM KST (UTC+9)
  workflow_dispatch:
    inputs:
      confirm:
        description: '⚠️ 수동 실행 시 deploy-tonight 라벨 PR이 즉시 머지됩니다. 서비스 운영 시간 주의. 확인하려면 confirm 입력'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  scheduled-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Find and merge PRs labeled 'deploy-tonight'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.confirm }}" != "confirm" ]; then
            echo "확인 값이 올바르지 않습니다. 종료합니다."
            exit 1
          fi

          REPO=${{ github.repository }}

          PR_NUMBERS=$(gh pr list \
            --label "deploy-tonight" \
            --state open \
            --repo "$REPO" \
            --json number \
            -q '.[].number')

          if [ -z "$PR_NUMBERS" ]; then
            echo "No PRs with 'deploy-tonight' label. Exiting."
            exit 0
          fi

          echo "$PR_NUMBERS" | while read PR_NUMBER; do
            echo "Merging PR #$PR_NUMBER..."
            if gh pr merge "$PR_NUMBER" --merge --repo "$REPO"; then
              echo "PR #$PR_NUMBER merged successfully."
            else
              echo "PR #$PR_NUMBER merge failed (conflict or checks not passed). Skipping."
            fi
          done
